name: Digest RSS (quotidien, hebdomadaire, mensuel)

on:
  schedule:
    # GitHub lance ces tâches avec beaucoup de retard (4 h 30 à 7 h 45
    # observés entre octobre et novembre 2026 pour le créneau de 00:17 UTC),
    # alors que la revue quotidienne démarre à 07:00 UTC (08:00 à Paris
    # l'hiver). Trois créneaux, pour qu'au moins un passage tombe avant :
    # - 21:43 UTC la veille : arrive avant 07:00 même avec 9 h de retard ;
    # - 00:17 et 03:47 UTC : rafraîchissent le digest s'ils arrivent à temps.
    # Le script est idempotent (archive dédoublonnée par URL) : plusieurs
    # passages par jour ne créent pas de doublons. La revue sait aussi
    # déclencher elle-même un passage (workflow_dispatch) si le digest
    # a plus de 12 h.
    - cron: "43 21 * * *"
    - cron: "17 0 * * *"
    - cron: "47 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install feedparser requests

      - name: Collecter les flux RSS
        run: python3 collect_digest.py

      - name: Publier les digests si changés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add -A digest/latest.md digest/week.md digest/month.md digest/history.jsonl digest/archive
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -m "Digest du $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
