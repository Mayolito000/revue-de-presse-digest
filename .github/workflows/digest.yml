name: Digest RSS quotidien

on:
  schedule:
    # 03:00 UTC = 04:00 ou 05:00 heure de Paris selon l'heure d'été/hiver,
    # donc toujours avant 6h du matin heure de Paris.
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install feedparser requests

      - name: Collecter les flux RSS
        run: python3 collect_digest.py

      - name: Publier le digest si changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add digest/latest.md
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -m "Digest du $(date -u +%Y-%m-%d)"
            git push
          fi
