name: Digest RSS (quotidien, hebdomadaire, mensuel)

on:
  schedule:
    # 00:17 UTC = 01:17 ou 02:17 heure de Paris selon l'heure d'hiver/d'été.
    # Minute décalée (pas :00) et large avance sur la revue quotidienne
    # (06:00 UTC), car GitHub retarde souvent les tâches planifiées.
    - cron: "17 0 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install feedparser requests

      - name: Collecter les flux RSS
        run: python3 collect_digest.py

      - name: Publier les digests si changés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add -A digest/latest.md digest/week.md digest/month.md digest/history.jsonl digest/archive
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -m "Digest du $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
