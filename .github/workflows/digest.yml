name: Digest RSS (quotidien, hebdomadaire, mensuel)

on:
  schedule:
    # 00:17 UTC = 01:17 ou 02:17 heure de Paris selon l'heure d'hiver/d'été.
    # Minute décalée (pas :00) et large avance sur la revue quotidienne
    # (06:00 UTC), car GitHub retarde souvent les tâches planifiées.
    - cron: "17 0 * * *"
  workflow_dispatch:
    inputs:
      rattrapage:
        description: "Regénérer les QCM des N derniers jours (0 = run normal)"
        required: false
        default: "0"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install feedparser requests anthropic

      - name: Collecter les flux RSS
        run: python3 collect_digest.py

      # QCM d'actualité et fiches de révision (revisions.py). Avec le secret
      # ANTHROPIC_API_KEY, les questions et synthèses sont rédigées par Claude ;
      # sans lui, le script produit une version automatique gratuite. Une
      # erreur ici ne doit jamais bloquer la publication du digest.
      - name: Générer QCM et fiches de révision
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RATTRAPAGE: ${{ github.event.inputs.rattrapage || '0' }}
        run: python3 revisions.py --rattrapage "$RATTRAPAGE"

      - name: Publier les digests si changés
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --mixed origin/main
          git add -A digest/latest.md digest/week.md digest/month.md digest/history.jsonl digest/archive digest/revisions
          if git diff --cached --quiet; then
            echo "Rien de nouveau à publier."
          else
            git commit -m "Digest du $(date -u +%Y-%m-%d)"
            git push origin HEAD:main
          fi
